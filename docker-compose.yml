services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  auth:
    build: ./services/Auth
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8001:8000"

  league:
    build: ./services/League
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8002:8000"

  club:
    build: ./services/Club
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8003:8000"

  match:
    build: ./services/Match
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8004:8000"

  footballer:
    build: ./services/Footballer
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8005:8000"

  transfers:
    build: ./services/Transfers
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8006:8000"

  table:
    build: ./services/Table
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8007:8000"

  match-review:
    build: ./services/Match-review
    environment:
      - MONGO_URL=mongodb://mongo:27017/football
    depends_on:
      - mongo
    ports:
      - "8008:8000"

volumes:
  mongo-data:
